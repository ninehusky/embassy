[package]
edition = "2024"
name = "embassy-nrf52840-examples"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
embassy-futures = { version = "0.1.2", path = "../../embassy-futures" }
embassy-sync = { version = "0.8.0", path = "../../embassy-sync", features = ["defmt"] }
embassy-executor = { version = "0.10.0", path = "../../embassy-executor", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", path = "../../embassy-time", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11.0", path = "../../embassy-nrf", features = ["defmt", "nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac", "time", "net-driver"] }
embassy-net = { version = "0.9.1", path = "../../embassy-net", features = ["defmt", "tcp", "dhcpv4", "medium-ethernet","udp", "medium-ieee802154", "proto-ipv6"] }
embassy-usb = { version = "0.6.0", path = "../../embassy-usb", features = ["defmt"] }
embedded-io = { version = "0.7.1", features = ["defmt"]  }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
embassy-net-esp-hosted = { version = "0.3.0", path = "../../embassy-net-esp-hosted", features = ["defmt", "esp-hosted-fg"] }
embassy-net-enc28j60 = { version = "0.3.0", path = "../../embassy-net-enc28j60", features = ["defmt"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"

fixed = "1.10.0"
static_cell = { version = "2" }
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
rand = { version = "0.9.0", default-features = false }
embedded-storage = "0.3.1"
usbd-hid = "0.10.0"
serde = { version = "1.0.136", default-features = false }
embedded-hal = { version = "1.0" }
embedded-hal-async = { version = "1.0" }
embedded-hal-bus = { version = "0.1", features = ["async"] }
num-integer = { version = "0.1.45", default-features = false }
microfft = "0.5.0"
portable-atomic = "1"

flux-rs = { path = "../../third_party/flux/lib/flux-rs" }

# Run with:
#
#   CARGO_INCREMENTAL=0 cargo flux check
#
# Two one-time prerequisites:
#   * `rustup target add thumbv7em-none-eabi --toolchain nightly-2026-02-05`.
#     cargo-flux forces its own toolchain, compiled in from Flux's
#     rust-toolchain.toml, which does not inherit this repo's `targets` list, so
#     without this every dependency fails with `can't find crate for core`.
#   * CARGO_INCREMENTAL=0. flux-driver rejects `-C incremental`, and cargo-flux's
#     `[profile.flux] incremental = false` does not reach build-script units.
[package.metadata.flux]
enabled = true
cache = true
# The panic-tracing loop targets this binary: build it, find a panic in the
# disassembly, trace it back through embassy-net into xarxa. Checking the other
# bins here would only add noise.
include = ["src/bin/usb_ethernet.rs"]

[profile.release]
debug = 2

[package.metadata.embassy]
build = [
  { target = "thumbv7em-none-eabi", artifact-dir = "out/examples/nrf52840" }
]
