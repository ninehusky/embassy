[package]
edition = "2024"
name = "embassy-nrf52840-examples"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
embassy-futures = { version = "0.1.2", path = "../../embassy-futures" }
embassy-sync = { version = "0.8.0", path = "../../embassy-sync", features = ["defmt"] }
embassy-executor = { version = "0.10.0", path = "../../embassy-executor", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", path = "../../embassy-time", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11.0", path = "../../embassy-nrf", features = ["defmt", "nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac", "time", "net-driver"] }
embassy-net = { version = "0.9.1", path = "../../embassy-net", features = ["defmt", "tcp", "dhcpv4", "medium-ethernet","udp", "medium-ieee802154", "proto-ipv6"] }
embassy-usb = { version = "0.6.0", path = "../../embassy-usb", features = ["defmt"] }
embedded-io = { version = "0.7.1", features = ["defmt"]  }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
embassy-net-esp-hosted = { version = "0.3.0", path = "../../embassy-net-esp-hosted", features = ["defmt", "esp-hosted-fg"] }
embassy-net-enc28j60 = { version = "0.3.0", path = "../../embassy-net-enc28j60", features = ["defmt"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"

fixed = "1.10.0"
static_cell = { version = "2" }
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
rand = { version = "0.9.0", default-features = false }
embedded-storage = "0.3.1"
usbd-hid = "0.10.0"
serde = { version = "1.0.136", default-features = false }
embedded-hal = { version = "1.0" }
embedded-hal-async = { version = "1.0" }
embedded-hal-bus = { version = "0.1", features = ["async"] }
num-integer = { version = "0.1.45", default-features = false }
microfft = "0.5.0"
portable-atomic = "1"

# No [package.metadata.flux] here yet. Flux's sysroot (~/.flux) is host-only -- it
# has no lib/rustlib/thumbv7em-none-eabi -- so `cargo flux check` in this workspace
# dies with `can't find crate for core` before reaching any of our code. Enabling
# Flux on this binary needs a Flux sysroot cross-built for thumbv7em-none-eabi.
# Until then the panic-tracing loop runs against embassy-net directly, with this
# binary's exact feature set:
#
#   cd ../../embassy-net && cargo flux check -p embassy-net \
#     --features "defmt,tcp,dhcpv4,medium-ethernet,udp,medium-ieee802154,proto-ipv6"

[profile.release]
debug = 2

[package.metadata.embassy]
build = [
  { target = "thumbv7em-none-eabi", artifact-dir = "out/examples/nrf52840" }
]

# No [patch] section. xarxa used to need one because embassy-net declared it as a
# git dependency; embassy-net now path-depends on the third_party/xarxa submodule
# directly, so the patch was dead and cargo warned about it on every build.
#
# defmt-rtt used to be patched to third_party/defmt-rtt, a local copy carrying
# `--cfg fluxopt="..."` arms for the panic-cliff size study. That study is moving
# to its own repo, and the copy lives in a gitignored directory, so the patch made
# this example unbuildable from a fresh clone. The copy is untouched on disk if it
# is ever wanted back.
